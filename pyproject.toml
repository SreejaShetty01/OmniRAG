[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnirag"
version = "0.6.0"
description = "A modular, profile-based retrieval augmented generation foundation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "uvicorn[standard]>=0.27,<1.0",
    "qdrant-client>=1.8,<2.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "tree-sitter-language-pack>=0.6,<1.0",
    "langgraph>=0.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.9,<1.0",
]
docling = ["docling>=2.0,<3.0"]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["omnirag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
pythonpath = ["backend/src"]
markers = ["live_qdrant: requires a real Qdrant server configured by OMNIRAG_7A_QDRANT_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"