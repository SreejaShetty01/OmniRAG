name: CI
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          touch .env.phase8 .env.phase8-rw
          docker compose -f docker/compose.yml -f docker/compose.eval.yml config --quiet
      - name: Build Docker image
        run: docker build -f docker/Dockerfile --tag omnirag:ci .